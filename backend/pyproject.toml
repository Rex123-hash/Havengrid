[project]
name = "havengrid-backend"
version = "0.0.1"
description = "HAVEN GRID — deterministic truth layer (Backend Phase 0). Seeded demonstration data only."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.30",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["havengrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
